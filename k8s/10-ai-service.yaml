# Optional: requires Azure OpenAI or OpenAI credentials.
# Skip this file if you do not have an API key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: aks-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: ghcr.io/azure-samples/aks-store-demo/ai-service:2.2.0
          ports:
            - containerPort: 5001
          env:
            - name: USE_AZURE_OPENAI
              value: "False"
            - name: OPENAI_API_KEY
              value: "" # fill in your OpenAI API key
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: aks-store
spec:
  selector:
    app: ai-service
  ports:
    - port: 5001
      targetPort: 5001
