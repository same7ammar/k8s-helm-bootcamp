apiVersion: apps/v1
kind: Deployment
metadata:
  name: makeline-service
  namespace: aks-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: makeline-service
  template:
    metadata:
      labels:
        app: makeline-service
    spec:
      containers:
        - name: makeline-service
          image: ghcr.io/azure-samples/aks-store-demo/makeline-service:2.2.0
          ports:
            - containerPort: 3001
          env:
            - name: ORDER_QUEUE_URI
              value: "amqp://rabbitmq:5672"
            - name: ORDER_QUEUE_USERNAME
              value: "username"
            - name: ORDER_QUEUE_PASSWORD
              value: "password"
            - name: ORDER_QUEUE_NAME
              value: "orders"
            - name: ORDER_DB_URI
              value: "mongodb://documentdb:10260/?tls=true&tlsAllowInvalidCertificates=true"
            - name: ORDER_DB_NAME
              value: "orderdb"
            - name: ORDER_DB_COLLECTION_NAME
              value: "orders"
            - name: ORDER_DB_USERNAME
              value: "username"
            - name: ORDER_DB_PASSWORD
              value: "password"
---
apiVersion: v1
kind: Service
metadata:
  name: makeline-service
  namespace: aks-store
spec:
  selector:
    app: makeline-service
  ports:
    - port: 3001
      targetPort: 3001
