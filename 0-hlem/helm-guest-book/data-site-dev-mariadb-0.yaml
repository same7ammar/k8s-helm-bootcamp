apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-site-dev-mariadb-0 
  labels:
    app.kubernetes.io/component: primary
    app.kubernetes.io/instance: site-dev
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/part-of: mariadb
  namespace: default
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
  storageClassName: ssdv2-performance
