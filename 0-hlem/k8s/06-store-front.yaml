apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-front
  namespace: aks-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store-front
  template:
    metadata:
      labels:
        app: store-front
    spec:
      containers:
        - name: store-front
          image: ghcr.io/azure-samples/aks-store-demo/store-front:2.2.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: store-front
  namespace: aks-store
spec:
  selector:
    app: store-front
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
